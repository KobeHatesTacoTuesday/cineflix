<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f12;
            --surface: #171a21;
            --primary: #e50914;
            --text: #ffffff;
            --text-muted: #9ea4b0;
            --border: rgba(255,255,255,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 40px; min-height: 100vh; }

        header {
            position: sticky; top: 0; z-index: 100; background: rgba(23,26,33,.96);
            backdrop-filter: blur(10px);
            padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
            gap: 16px; border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        .search-input {
            width: min(360px, 55vw); padding: 9px 16px; background: #0d0f12; border: 1px solid var(--border);
            border-radius: 20px; color: var(--text); outline: none;
        }
        .search-input:focus { border-color: rgba(229,9,20,.8); }

        .main { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .status { color: var(--text-muted); padding: 24px 0; text-align: center; display: none; }
        .status.show { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
        .card { background: var(--surface); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; transition: transform 0.2s, border-color .2s; }
        .card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,.22); }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #08090b; }
        .poster-placeholder { width: 100%; aspect-ratio: 2/3; display: grid; place-items: center; background: #08090b; color: #626874; font-size: .75rem; text-align: center; padding: 12px; }
        .info { padding: 10px; font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
        .modal.active { display: flex; }
        .modal-box { background: var(--surface); width: 100%; max-width: 900px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--border); box-shadow: 0 20px 80px rgba(0,0,0,.55); }
        .close-btn { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.82); border: 1px solid rgba(255,255,255,.16); color: #fff; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; z-index: 10; font-weight: bold; }
        .player-box { width: 100%; aspect-ratio: 16/9; background: #000; display: grid; place-items: center; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        .player-message { color: var(--text-muted); font-size: .9rem; padding: 20px; text-align: center; }

        .controls { padding: 16px; display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--border); }
        .srv-btn { padding: 8px 14px; background: #0d0f12; border: 1px solid var(--border); color: var(--text-muted); border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
        .srv-btn:hover { color: #fff; }
        .srv-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        @media (max-width: 600px) {
            header { padding: 12px 14px; }
            .logo { font-size: 1.15rem; }
            .search-input { width: 58vw; }
            .main { padding: 0 12px; }
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .modal { padding: 0; }
            .modal-box { border-radius: 0; max-width: none; }
        }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo" id="logo">🎬 CineFlix</a>
        <input type="search" id="search" class="search-input" placeholder="Search catalog..." autocomplete="off">
    </header>

    <main class="main">
        <div class="status show" id="status">Loading movies…</div>
        <div class="grid" id="grid"></div>
    </main>

    <div class="modal" id="modal" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true" aria-label="Movie player">
            <button class="close-btn" id="closeBtn" type="button" aria-label="Close player">✕</button>
            <div class="player-box" id="player"></div>
            <div class="controls">
                <button class="srv-btn active" type="button" data-source="autoembed">Server 1</button>
                <button class="srv-btn" type="button" data-source="vidsrcapi">Server 2</button>
                <button class="srv-btn" type="button" data-source="vidsrchair">Server 3</button>
            </div>
        </div>
    </div>

    <script>
        // GitHub Pages is static, so TMDB is requested directly from the browser.
        const TMDB_API_KEY = '232a7338c36748bff95e5de149a21b95';

        const grid = document.getElementById('grid');
        const statusEl = document.getElementById('status');
        const searchEl = document.getElementById('search');
        const modal = document.getElementById('modal');
        const player = document.getElementById('player');
        const serverButtons = [...document.querySelectorAll('.srv-btn')];

        let currentId = null;
        let requestController = null;
        let searchTimer = null;

        function setStatus(message = '') {
            statusEl.textContent = message;
            statusEl.classList.toggle('show', Boolean(message));
        }

        async function fetchMovies(query = '') {
            if (requestController) requestController.abort();
            requestController = new AbortController();

            setStatus(query ? 'Searching…' : 'Loading movies…');

            const url = query
                ? `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=en-US&include_adult=false&query=${encodeURIComponent(query)}`
                : `https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_API_KEY}&language=en-US`;

            try {
                const res = await fetch(url, {
                    signal: requestController.signal,
                    headers: { 'Accept': 'application/json' }
                });

                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);

                const movies = Array.isArray(data.results) ? data.results : [];
                render(movies);
                setStatus(movies.length ? '' : 'No movies found.');
            } catch (err) {
                if (err.name === 'AbortError') return;
                console.error(err);
                grid.replaceChildren();
                setStatus(`Could not load the catalog: ${err.message}`);
            }
        }

        function render(movies) {
            grid.replaceChildren();

            const fragment = document.createDocumentFragment();
            movies.forEach(movie => {
                const card = document.createElement('article');
                card.className = 'card';
                card.tabIndex = 0;
                card.setAttribute('role', 'button');
                card.setAttribute('aria-label', `Play ${movie.title || 'movie'}`);

                if (movie.poster_path) {
                    const img = document.createElement('img');
                    img.className = 'poster';
                    img.loading = 'lazy';
                    img.alt = movie.title ? `${movie.title} poster` : 'Movie poster';
                    img.src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                    card.appendChild(img);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'poster-placeholder';
                    placeholder.textContent = 'No poster available';
                    card.appendChild(placeholder);
                }

                const info = document.createElement('div');
                info.className = 'info';
                info.textContent = movie.title || movie.original_title || 'Untitled';
                card.appendChild(info);

                const activate = () => openPlayer(movie.id);
                card.addEventListener('click', activate);
                card.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        activate();
                    }
                });

                fragment.appendChild(card);
            });

            grid.appendChild(fragment);
        }

        function openPlayer(id) {
            if (!id) return;
            currentId = String(id);
            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            loadSource('autoembed', serverButtons[0]);
        }

        function loadSource(type, button) {
            if (!currentId) return;

            serverButtons.forEach(btn => btn.classList.remove('active'));
            if (button) button.classList.add('active');

            const sources = {
                autoembed: `https://player.autoembed.cc/embed/movie/${encodeURIComponent(currentId)}`,
                vidsrcapi: `https://vidsrcapi.com/embed/movie/${encodeURIComponent(currentId)}`,
                vidsrchair: `https://vidsrc.hair/embed/movie/${encodeURIComponent(currentId)}`
            };

            const targetUrl = sources[type];
            if (!targetUrl) {
                player.innerHTML = '<div class="player-message">Unknown player source.</div>';
                return;
            }

            const iframe = document.createElement('iframe');
            iframe.src = targetUrl;
            iframe.title = 'Video player';
            iframe.allowFullscreen = true;
            iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
            player.replaceChildren(iframe);
        }

        function closeModal() {
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            player.replaceChildren();
            currentId = null;
            document.body.style.overflow = '';
        }

        serverButtons.forEach(button => {
            button.addEventListener('click', () => loadSource(button.dataset.source, button));
        });

        document.getElementById('closeBtn').addEventListener('click', closeModal);
        modal.addEventListener('click', event => {
            if (event.target === modal) closeModal();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });

        document.getElementById('logo').addEventListener('click', event => {
            event.preventDefault();
            searchEl.value = '';
            fetchMovies();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        searchEl.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => fetchMovies(searchEl.value.trim()), 300);
        });

        fetchMovies();
    </script>
</body>
</html>
